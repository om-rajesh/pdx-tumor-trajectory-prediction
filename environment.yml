# Software environment for both notebooks. The kernel name is "pdxe".
#
# The versions are those recorded by the analysis run of 2026-10-18
# (Section 1.1 of Analysis_Notebook.ipynb; matplotlib from Section 1.1 of the
# figures notebook), which ran on Windows 10 x86-64 with Python 3.11.15.
#
#   conda env create -f environment.yml
#   conda activate pdxe
#   python -m ipykernel install --user --name pdxe --display-name pdxe
#
# JAX runs on the CPU, so no GPU or CUDA build is needed. For pip instead of
# conda, see requirements.txt.
name: pdxe
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  # numerical core
  - numpy=2.4.6
  - pandas=2.2.3
  - scipy=1.17.1
  # learners, regression and mixed models
  - scikit-learn=1.9.0
  - statsmodels=0.14.6
  # Bayesian tolerant-subpopulation model (Section 5.6)
  - jax=0.10.2
  - jaxlib=0.10.2
  - numpyro=0.21.0
  # input and cache formats: the source workbook (.xlsx) and the Parquet
  # caches of its sheets in outputs/interim/
  - openpyxl=3.1.5
  - pyarrow=15.0.2
  # figures notebook
  - matplotlib=3.10.9
  # Jupyter kernel and front end (leave out jupyterlab if you use VS Code)
  - ipykernel
  - jupyterlab
